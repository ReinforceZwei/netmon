services:
  netmon:
    build: .
    image: netmon:latest
    container_name: netmon
    restart: unless-stopped
    # Deliberately NOT in gluetun's network namespace: probes must measure the
    # real WAN, not the VPN tunnel. Default bridge -> host's normal routing.
    environment:
      TZ: ${TZ:-Asia/Taipei}
      NETMON_DATA_DIR: /data
      NETMON_PORT: "9120"
      # Optional bootstrap (ignored once settings exist in the database):
      # NETMON_TARGETS: "1.1.1.1,8.8.8.8"
      # NETMON_WEBHOOK_URL: "https://discord.com/api/webhooks/…"
    ports:
      - "9120:9120"
    volumes:
      - ./data:/data
    cap_add:
      - NET_RAW          # ICMP raw sockets (the container runs as root, which
                         # already has it; kept explicit so hardened daemon
                         # defaults or a future non-root user still work)
    security_opt:
      - no-new-privileges:false
