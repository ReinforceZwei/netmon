services:
  netmon:
    # Published by the release workflow on v* tags (linux/amd64 + linux/arm64).
    # `docker compose pull && docker compose up -d` gets the newest release;
    # `docker compose up -d --build` builds from this checkout instead.
    image: ghcr.io/reinforcezwei/netmon:latest
    build: .
    container_name: netmon
    restart: unless-stopped
    # Host networking on purpose:
    #  - latency probes measure the host's real path (no docker NAT hop)
    #  - default-gateway auto-detection finds the actual LAN router instead of
    #    the docker bridge, so LAN faults stay separate from WAN faults
    # Deliberately NOT gluetun's namespace either: probes must not go through
    # the VPN tunnel. If you must use bridge networking instead, drop
    # network_mode + re-add the ports mapping, and put your router IP in the
    # target list by hand (auto-detection would report the docker bridge).
    network_mode: host
    environment:
      TZ: ${TZ:-Asia/Taipei}
      NETMON_DATA_DIR: /data
      NETMON_PORT: "9120"
      # Optional bootstrap (ignored once settings exist in the database):
      # NETMON_TARGETS: "1.1.1.1,8.8.8.8"
      # NETMON_WEBHOOK_URL: "https://discord.com/api/webhooks/…"
    volumes:
      - ./data:/data
    cap_add:
      - NET_RAW          # ICMP raw sockets (explicit; the container runs as
                         # root, so this only matters if you harden defaults)
